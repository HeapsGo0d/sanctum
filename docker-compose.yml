services:
  sanctum:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SANCTUM_VERSION: dev
    container_name: sanctum
    privileged: true  # Required for /etc/hosts modification
    ports:
      - "8080:8080"   # Open WebUI
    volumes:
      - ./test-workspace:/workspace
    environment:
      # Only overrides belong here. Ollama, Open WebUI and the telemetry-off
      # vars are all set in the Dockerfile - duplicating them lets the two drift.
      - PRIVACY_MODE=enabled

    # GPU support (uncomment if running with NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    stdin_open: true
    tty: true
    restart: unless-stopped
