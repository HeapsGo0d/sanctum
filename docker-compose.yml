services:
  sanctum:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SANCTUM_VERSION: dev
    container_name: sanctum
    ports:
      - "8080:8080"   # Open WebUI
    volumes:
      - ./test-workspace:/workspace
    # No environment block: every setting lives in the Dockerfile so the two
    # cannot drift. Add overrides here only for local experiments.

    # GPU support (uncomment if running with NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    stdin_open: true
    tty: true
    restart: unless-stopped
